name: chart-release

on:
  push:
    tags: ["chart-v*"]

permissions:
  contents: read
  packages: write
  id-token: write   # keyless cosign signs with the OIDC token of the run

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Without the pin pull request of the images workflow, the chart has no
      # image tags and does not install.
      - name: the chart values pin the images
        run: |
          set -euo pipefail
          for flavor in vanilla playerbots; do
            helm template t charts/azerothcore --set flavor=$flavor
          done > rendered.yaml

      # Without this annotation, Artifact Hub scans only the images of a render
      # with the default values, which leaves out the playerbots flavor.
      - name: list the images for the artifact hub scan
        run: |
          set -euo pipefail
          # Artifact Hub does not scan a chart version with more images.
          max_scanned_images=15
          images="$(yq ea '[.. | select(tag == "!!map" and has("image")) | .image] | unique
            | map({"name": (split("@")[0] | split("/") | .[-1] | split(":")[0]), "image": .})' rendered.yaml)"
          count="$(yq length <<< "$images")"
          if (( count > max_scanned_images )); then
            echo "::error::the chart has $count images, but Artifact Hub scans at most $max_scanned_images"
            exit 1
          fi
          IMAGES="$images" yq -i '.annotations."artifacthub.io/images" = strenv(IMAGES)' charts/azerothcore/Chart.yaml

      - name: package + push
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR names are lowercase
          version="${GITHUB_REF_NAME#chart-v}"
          # Artifact Hub shows the README from the chart package, and the GPL
          # wants its text in each copy of the chart.
          cp README.md LICENSE charts/azerothcore/
          helm package charts/azerothcore --version "$version"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "azerothcore-$version.tgz" "oci://ghcr.io/$owner/charts" 2>&1 | tee push.log
          echo "ref=ghcr.io/$owner/charts/azerothcore@$(sed -n 's/^Digest: //p' push.log)" >> "$GITHUB_OUTPUT"

      - name: sign the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.push.outputs.ref }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$REF"
          # The verify command of the README uses this identity.
          cosign verify "$REF" \
            --certificate-identity-regexp "^$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/\.github/workflows/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null

      - name: push the artifact hub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          oras push "ghcr.io/$owner/charts/azerothcore:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
