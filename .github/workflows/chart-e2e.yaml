name: chart-e2e

on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag to test
        default: latest
  schedule:
    - cron: "42 3 * * *" # nightly 03:42 UTC

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: [vanilla, playerbots]
    env:
      FLAVOR: ${{ matrix.flavor }}
      TAG: ${{ inputs.tag || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR names are lowercase.
      - name: image namespace
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: e2e

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: load images into kind
        run: |
          set -euo pipefail
          for img in worldserver authserver db-import client-data; do
            docker pull "$REGISTRY/azerothcore-$FLAVOR-$img:$TAG"
            kind load docker-image --name e2e "$REGISTRY/azerothcore-$FLAVOR-$img:$TAG"
          done

      - name: install
        run: |
          set -euo pipefail
          args=()
          for img in worldserver:worldserver authserver:authserver dbImport:db-import clientData:client-data; do
            key="images.$FLAVOR.${img%%:*}"
            args+=(--set "$key.registry=ghcr.io" --set "$key.repository=$OWNER/azerothcore-$FLAVOR-${img#*:}"
              --set "$key.tag=$TAG" --set "$key.digest=")
          done
          # The realm address is the worldserver Service, so that a pod can
          # follow the realm list.
          helm install ac charts/azerothcore -n azerothcore --create-namespace "${args[@]}" \
            --set "flavor=$FLAVOR" \
            --set authserver.service.type=ClusterIP \
            --set worldserver.service.type=ClusterIP \
            --set dbInit.realm.address=ac-azerothcore-worldserver \
            --set 'dbInit.accounts[0].username=e2e' \
            --set 'dbInit.accounts[0].password=e2epass' \
            --set 'dbInit.accounts[0].gmlevel=3'

      - name: wait for the jobs and the servers
        run: |
          set -euo pipefail
          kubectl -n azerothcore wait --for=condition=complete job -l app.kubernetes.io/component=db-init --timeout=1200s
          kubectl -n azerothcore wait --for=condition=complete job -l app.kubernetes.io/component=client-data --timeout=1200s
          kubectl -n azerothcore rollout status deploy/ac-azerothcore-authserver --timeout=600s
          kubectl -n azerothcore rollout status deploy/ac-azerothcore-worldserver --timeout=900s

      - name: check the databases
        run: |
          set -euo pipefail
          pw="$(kubectl -n azerothcore get secret ac-azerothcore-db -o jsonpath='{.data.root-password}' | base64 -d)"
          # The unix socket fails on kind (docker-library/mysql#936).
          q() { kubectl -n azerothcore exec ac-azerothcore-mysql-0 -- env MYSQL_PWD="$pw" mysql -h 127.0.0.1 -uroot -N -e "$1"; }
          q "SELECT a.username, aa.gmlevel, aa.RealmID FROM acore_auth.account a JOIN acore_auth.account_access aa ON aa.id = a.id" \
            | tee /dev/stderr | grep -q "^E2E	3	-1$"
          test "$(q "SELECT COUNT(*) FROM acore_world.creature_template")" -gt 1000
          if [ "$FLAVOR" = playerbots ]; then
            test "$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'acore_playerbots'")" -gt 0
          fi

      # The authserver reads the online state of the realm every 20 seconds.
      - name: helm test (log in as the e2e account)
        run: |
          for attempt in 1 2 3; do
            helm test ac -n azerothcore --logs --timeout 5m && exit 0
            sleep 20
          done
          exit 1

      - name: follow the realm list to the worldserver
        run: |
          set -euo pipefail
          python_image="$(yq '.images.python | .registry + "/" + .repository + ":" + .tag' charts/azerothcore/values.yaml)"
          kubectl -n azerothcore run world-check --restart=Never \
            --image="$python_image" \
            --overrides='{"apiVersion":"v1","spec":{"containers":[{"name":"world-check","image":"'"$python_image"'",
              "command":["python3","/scripts/auth-check.py","--host","ac-azerothcore-authserver","--user","e2e","--password","e2epass","--expect-online","--check-world"],
              "volumeMounts":[{"name":"scripts","mountPath":"/scripts"}]}],
              "volumes":[{"name":"scripts","configMap":{"name":"ac-azerothcore-scripts"}}]}}'
          kubectl -n azerothcore wait --for=jsonpath='{.status.phase}'=Succeeded pod/world-check --timeout=120s
          kubectl -n azerothcore logs pod/world-check

      - name: upgrade (db-init must be idempotent)
        run: |
          set -euo pipefail
          helm upgrade ac charts/azerothcore -n azerothcore --reuse-values --set dbInit.realm.name=e2e-upgrade
          kubectl -n azerothcore wait --for=condition=complete job/ac-azerothcore-db-init-r2 --timeout=1200s
          kubectl -n azerothcore logs job/ac-azerothcore-db-init-r2 -c db-init | grep -q "name = 'e2e-upgrade'"
          kubectl -n azerothcore wait --for=condition=complete job/ac-azerothcore-client-data-r2 --timeout=600s
          kubectl -n azerothcore logs job/ac-azerothcore-client-data-r2 | grep -q 'already installed'

      - name: diagnose on failure
        if: failure()
        run: |
          kubectl -n azerothcore get pods -o wide || true
          kubectl -n azerothcore get jobs || true
          for j in $(kubectl -n azerothcore get jobs -o name); do
            kubectl -n azerothcore logs "$j" --all-containers --tail=100 || true
          done
          kubectl -n azerothcore logs deploy/ac-azerothcore-worldserver -c worldserver --tail=100 || true
          for p in $(kubectl -n azerothcore get pods -o name); do
            kubectl -n azerothcore describe "$p" | tail -30 || true
          done
