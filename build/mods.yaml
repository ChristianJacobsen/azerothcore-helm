# Mod selection for build/build-images.sh.
#
# flavor:
#   vanilla          → base repo azerothcore/azerothcore-wotlk @ master
#   playerbots       → base repo mod-playerbots/azerothcore-wotlk @ Playerbot
#                      (mod-playerbots itself is added automatically)
#   playerbots-eluna → playerbots + mod-eluna
#
# mods: git URLs of AzerothCore modules (see https://www.azerothcore.org/catalogue.html),
# optionally with "@<branch-or-tag>". The default branch is used when omitted.
#
# NOTE: C++ mods are compiled into the server binaries. mod-playerbots cannot
# be used with flavor: vanilla (it requires the forked core, which the
# playerbots flavors select for you).
#
# After building, deploy with:
#   helm install ac charts/azerothcore -f build/images.generated.yaml -f your-values.yaml

flavor: playerbots

mods:
  # - https://github.com/azerothcore/mod-solocraft.git
  # - https://github.com/azerothcore/mod-ah-bot.git@master
