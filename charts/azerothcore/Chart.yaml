apiVersion: v2
name: azerothcore
description: |-
  AzerothCore World of Warcraft server for Wrath of the Lich King (3.3.5a):
  authserver, worldserver, MySQL, database updates, accounts, and client
  data. Two image flavors: vanilla (the core with mod-ale) and playerbots
  (the mod-playerbots fork of the core). Images with other modules build
  from the Dockerfile of the core.
type: application
version: 0.1.1
keywords:
  - azerothcore
  - world-of-warcraft
  - wow
  - wotlk
  - wrath-of-the-lich-king
  - private-server
  - playerbots
  - game-server
  - mmorpg
home: https://github.com/ChristianJacobsen/azerothcore-helm
sources:
