# -- The image set. vanilla: the AzerothCore core with mod-ale, like the
# images of AzerothCore. playerbots: the mod-playerbots fork of the core with
# mod-playerbots. It selects the images under images.<flavor>.
flavor: vanilla

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podLabels: {}

imagePullSecrets: []
imagePullPolicy: IfNotPresent

# The images workflow of this repository builds these images with the
# Dockerfile of the core, and it pins its latest builds below through a pull
# request.
images:
  vanilla:
    worldserver:
      registry: ghcr.io
      repository: christianjacobsen/azerothcore-vanilla-worldserver
      tag: "20261005-51c32b5"
      digest: "sha256:42266b29919f17e7faaa55a29b9779ff1d8f78900e15aeb8bd663f39c3147a51"
    authserver:
      registry: ghcr.io
      repository: christianjacobsen/azerothcore-vanilla-authserver
      tag: "20261005-51c32b5"
      digest: "sha256:94a3f895bf6623f521250d65efe6ae9d8d91ef2f0be1b2b0e486b7d8f5a4777b"
    # -- Must come from the same build as the servers, because the SQL
    # updates follow the core revision.
    dbImport:
      registry: ghcr.io
      repository: christianjacobsen/azerothcore-vanilla-db-import
      tag: "20261005-51c32b5"
      digest: "sha256:e346db13e74d3f88f04417017de027e16b11b43ddd6bef23a093f890eaa7cf90"
    clientData:
      registry: ghcr.io
      repository: christianjacobsen/azerothcore-vanilla-client-data
      tag: "20261005-51c32b5"
      digest: "sha256:9d461d8ae0b35c463a8f7266c02ddd6d02cb75de8b4a17f909fe7566ee0d56ed"
  playerbots:
    worldserver:
      registry: ghcr.io
      repository: christianjacobsen/azerothcore-playerbots-worldserver
      tag: "20261005-7f12e89"
      digest: "sha256:984649256fc54dbf036ebd130be46dcb504cdfe9d9ec4119cc04f082f42283df"
    authserver:
      registry: ghcr.io
      repository: christianjacobsen/azerothcore-playerbots-authserver
      tag: "20261005-7f12e89"
      digest: "sha256:dd935801458e4482bbd65136282132e454aac85b31201867fee694b441506ef3"
    dbImport:
      registry: ghcr.io
      repository: christianjacobsen/azerothcore-playerbots-db-import
      tag: "20261005-7f12e89"
      digest: "sha256:107f51b668b025031f1c6122f75357caadf8ad43a1835a42e0a3b5d89615a872"
    clientData:
      registry: ghcr.io
      repository: christianjacobsen/azerothcore-playerbots-client-data
      tag: "20261005-7f12e89"
      digest: "sha256:c55b8ebae35037c729e33f0cc37d4d407020c8f1dfdc8181869cedcbf52adde2"
  # -- kubectl, for the init containers that wait for the Jobs.
  # renovate: datasource=docker depName=registry.k8s.io/kubectl
  kubectl:
    registry: registry.k8s.io
    repository: kubectl
    tag: v1.35.9
    digest: ""
  # -- Python without pip (build/python.Dockerfile), for the account SQL of the
  # db-init Job and for helm test.
  python:
    registry: ghcr.io
    repository: christianjacobsen/azerothcore-python
    tag: "3.14.7-alpine-20261005"
    digest: "sha256:2dff9c4e41782b34682ea182088257710ef9ef778286d9fe1d0338726a526ad8"

# -- The images of the core run as uid 1000, the acore user of its Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

database:
  # -- Database user for the servers and dbimport. The db-init Job creates it
  # when it has admin access (bundled MySQL, or externalDatabase.adminUser).
  user: acore
  # -- Password of `user`. Empty = the chart generates one and keeps it
  # across upgrades. Do not use ";": it separates the fields of the
  # AzerothCore database connection strings.
  password: ""
  # -- Existing Secret with the passwords. Keys: `password` (for `user`),
  # `root-password` (bundled MySQL) or `admin-password` (external database
  # with adminUser). Overrides the password values above.
  existingSecret: ""
  names:
    auth: acore_auth
    world: acore_world
    characters: acore_characters
    # -- Used by the playerbots flavor only. The worldserver fills it.
    playerbots: acore_playerbots

mysql:
  # -- false = use `externalDatabase`.
  enabled: true
  # -- MySQL 9.7 without gosu and MySQL Shell (build/mysql.Dockerfile). It runs
  # as uid 999. A new major version of MySQL upgrades the data directory, and
  # the upgrade cannot be undone.
  image:
    registry: ghcr.io
    repository: christianjacobsen/azerothcore-mysql
    tag: "9.7.2-20261005"
    digest: "sha256:d46b331b646a6c48762fb0307374c733a675c0e7ba8f82f61fd2ed98e07e9102"
  # -- Root password. Empty = generated and kept across upgrades. MySQL reads
  # it only when it initializes an empty data directory.
  rootPassword: ""
  # -- Extra mysqld arguments.
  # --skip-log-bin: MySQL 8.4 keeps a binary log (for replication) by
  #   default and flushes it to disk on every statement. The world import
  #   writes several hundred MB of it.
  # --innodb-flush-log-at-trx-commit=2: flush the InnoDB log once a second
  #   instead of at every commit. A MySQL crash loses nothing. A node crash
  #   can lose the last second of writes.
  extraArgs:
    - --innodb-buffer-pool-size=512M
    - --skip-log-bin
    - --innodb-flush-log-at-trx-commit=2
  storage:
    size: 10Gi
    # -- Empty = the default StorageClass of the cluster.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      # -- The world import needs headroom above the buffer pool. With 1 GiB,
      # the kernel stops mysqld during the import.
      memory: 2Gi

externalDatabase:
  # -- Used only when mysql.enabled=false.
  host: ""
  port: 3306
  # -- Admin user that can create databases and users. The db-init Job uses
  # it to create the databases and database.user. Empty = the databases and
  # the user exist already, and database.user owns them.
  adminUser: ""

clientData:
  # -- Where the client data lives (mounted at /azerothcore/env/dist/data).
  # The first match wins:
  # 1. volume: any Kubernetes volume source, for example nfs or hostPath.
  # 2. existingClaim: a PVC that you manage.
  # 3. Neither: the chart creates a PVC from `storage`. The chart keeps that
  #    PVC on `helm uninstall`, because the data takes 3.1 GB.
  volume: {}
  existingClaim: ""
  storage:
    size: 20Gi
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
  # -- How the client-data Job fills the volume:
  # download  download the extracted data release that the core expects
  #           (github.com/wowgaming/client-data)
  # none      no Job. The volume already holds dbc/, maps/, vmaps/ and mmaps/.
  source: download
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

dbInit:
  # -- Run the db-init Job on every install and upgrade. It creates the
  # databases, runs dbimport (the SQL updates of the core and the modules),
  # and sets the realm below.
  enabled: true
  realm:
    # -- Must match RealmID of the worldserver, which the chart sets.
    id: 1
    # -- Realm name in the realm list. Empty = keep the name in the database.
    name: "AzerothCore"
    # -- Address that game clients use to reach the worldserver. 127.0.0.1
    # works when you play on the machine that exposes the service. For LAN or
    # WAN players, set the LAN or WAN address (or the Gateway address).
    address: 127.0.0.1
    # -- Port that game clients use to reach the worldserver. null = the
    # worldserver service port, or its nodePort when the service type is
    # NodePort and a nodePort is set.
    port: null
  # -- Accounts to create when they do not exist. The Job never changes the
  # password of an existing account. On every run, it sets gmlevel (0 player,
  # 1 moderator, 2 game master, 3 administrator) for all realms.
  # Names: 17 characters at most. Passwords: 16 at most. Neither is
  # case-sensitive.
  # accounts:
  #   - username: admin
  #     password: changeme
  #     gmlevel: 3
  #   - username: admin2
  #     existingSecret: my-accounts
  #     passwordKey: admin2-password
  #     gmlevel: 3
  accounts: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi

authserver:
  # -- authserver.conf keys, verbatim from authserver.conf.dist. The chart
  # renders each key as the AC_<KEY> environment variable that the core
  # reads. Example:
  #   config:
  #     WrongPass.MaxCount: 5
  config: {}
  extraEnv: []
  service:
    # -- LoadBalancer exposes the standard game ports. Clients expect the
    # auth port 3724.
    type: LoadBalancer
    port: 3724
    # -- null = let Kubernetes allocate.
    nodePort: null
    annotations: {}
    externalTrafficPolicy: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

worldserver:
  # -- worldserver.conf keys and the keys of the module configs, verbatim
  # from their .conf.dist files. The chart renders each key as an AC_<KEY>
  # environment variable. Example:
  #   config:
  #     Rate.XP.Kill: 3
  #     AllowTwoSide.Interaction.Calendar: 1
  config: {}
  extraEnv: []
  soap:
    # -- SOAP remote console (ClusterIP service only). Log in with a GM
    # account (gmlevel 3).
    enabled: false
    port: 7878
  remoteAccess:
    # -- Telnet remote console (ClusterIP service only), for example through
    # kubectl port-forward.
    enabled: false
    port: 3443
  # -- Lua scripts for mod-ale, which the vanilla images include: any
  # Kubernetes volume source, for example a configMap or a
  # persistentVolumeClaim. The chart points ALE.ScriptPath at it.
  luaScripts: {}
  service:
    type: LoadBalancer
    port: 8085
    nodePort: null
    annotations: {}
    externalTrafficPolicy: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      # -- The playerbots flavor used about 3.9 GiB with 50 random bots.
      memory: 6Gi
  # -- The worldserver saves all players on SIGTERM.
  terminationGracePeriodSeconds: 60
  # -- The rollout includes the wait for the client-data Job, which takes
  # long on slow links.
  progressDeadlineSeconds: 3600
  startupProbe:
    periodSeconds: 10
    # -- The world loads in seconds. Slow nodes and emulated images take
    # minutes.
    failureThreshold: 90

playerbots:
  # -- playerbots.conf keys for the playerbots flavor, rendered like
  # worldserver.config, which wins on the same key. The chart lowers the
  # random bot count from 500 to 50. Raise worldserver.resources for more
  # bots.
  config:
    AiPlayerbot.MinRandomBots: 50
    AiPlayerbot.MaxRandomBots: 50

# -- Expose the game ports through Gateway API TCPRoutes. Requires the
# experimental-channel Gateway API CRDs (TCPRoute) and a Gateway controller
# that supports TCPRoute. Ingress cannot route the game protocols, because
# they are raw TCP.
gateway:
  enabled: false
  # -- Gateways or listeners for the routes. Each game port needs a TCP
  # listener on the Gateway. Example:
  #   parentRefs:
  #     authserver:
  #       - name: games
  #         namespace: gateway-system
  #         sectionName: wow-auth
  #     worldserver:
  #       - name: games
  #         namespace: gateway-system
  #         sectionName: wow-world
  parentRefs:
    authserver: []
    worldserver: []
  annotations: {}
