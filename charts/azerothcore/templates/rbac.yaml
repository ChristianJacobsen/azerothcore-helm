{{- if include "azerothcore.waitsForJobs" . -}}
# The server pods wait for the Jobs of their release revision. This
# is the smallest RBAC that `kubectl wait` needs for that.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "azerothcore.serviceAccountName" . }}
  labels:
    {{- include "azerothcore.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "azerothcore.serviceAccountName" . }}
  labels:
    {{- include "azerothcore.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "azerothcore.serviceAccountName" . }}
  labels:
    {{- include "azerothcore.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "azerothcore.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "azerothcore.serviceAccountName" . }}
{{- end }}
