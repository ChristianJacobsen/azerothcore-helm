{{- if not .Values.database.existingSecret -}}
{{- $name := include "azerothcore.db.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $password := .Values.database.password | default ((index $existing "password") | default "" | b64dec) | default (randAlphaNum 24) -}}
{{- if contains ";" $password -}}
{{- fail "database.password must not contain \";\": AzerothCore uses it as the field separator of its connection strings" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    # The MySQL volume outlives `helm uninstall`, and MySQL keeps the
    # passwords that it initialized with. A reinstall with the same release
    # name finds and reuses this Secret.
    helm.sh/resource-policy: keep
  labels:
    {{- include "azerothcore.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  {{- if .Values.mysql.enabled }}
  {{- $root := .Values.mysql.rootPassword | default ((index $existing "root-password") | default "" | b64dec) | default (randAlphaNum 24) }}
  root-password: {{ $root | quote }}
  {{- end }}
{{- end }}
