{{- if .Values.gateway.enabled -}}
{{/* Depending on the Gateway API release, the cluster serves TCPRoute at v1, v1alpha2, or both. */}}
{{- $apiVersion := "" -}}
{{- if .Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1/TCPRoute" -}}
  {{- $apiVersion = "gateway.networking.k8s.io/v1" -}}
{{- else if .Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1alpha2/TCPRoute" -}}
  {{- $apiVersion = "gateway.networking.k8s.io/v1alpha2" -}}
{{- else -}}
  {{- fail "gateway.enabled=true, but the cluster serves no TCPRoute API (gateway.networking.k8s.io v1 or v1alpha2). Install the experimental-channel Gateway API CRDs and a controller that routes TCP, or set gateway.enabled=false and use LoadBalancer or NodePort services." -}}
{{- end -}}
{{- range $route := list
  (dict "name" "authserver" "port" $.Values.authserver.service.port "parentRefs" $.Values.gateway.parentRefs.authserver)
  (dict "name" "worldserver" "port" $.Values.worldserver.service.port "parentRefs" $.Values.gateway.parentRefs.worldserver)
}}
{{- if not $route.parentRefs }}
{{- fail (printf "gateway.parentRefs.%s is empty. Each game port needs its own TCP listener: set sectionName on every parentRef." $route.name) }}
{{- end }}
---
apiVersion: {{ $apiVersion }}
kind: TCPRoute
metadata:
  name: {{ printf "%s-%s" (include "azerothcore.fullname" $) $route.name }}
  labels:
    {{- include "azerothcore.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $route.name }}
  {{- with $.Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $route.parentRefs | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ printf "%s-%s" (include "azerothcore.fullname" $) $route.name }}
          port: {{ $route.port }}
{{- end }}
{{- end }}
