apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-worldserver" (include "azerothcore.fullname" .) }}
  labels:
    {{- include "azerothcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: worldserver
  {{- with .Values.worldserver.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.worldserver.service.type }}
  {{- if and (ne .Values.worldserver.service.type "ClusterIP") .Values.worldserver.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.worldserver.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - name: world
      port: {{ .Values.worldserver.service.port }}
      targetPort: world
      {{- if and (ne .Values.worldserver.service.type "ClusterIP") .Values.worldserver.service.nodePort }}
      nodePort: {{ .Values.worldserver.service.nodePort }}
      {{- end }}
  selector:
    {{- include "azerothcore.selectorLabels" (dict "ctx" . "component" "worldserver") | nindent 4 }}
{{- if .Values.worldserver.soap.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-worldserver-soap" (include "azerothcore.fullname" .) }}
  labels:
    {{- include "azerothcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: worldserver
spec:
  type: ClusterIP
  ports:
    - name: soap
      port: 7878
      targetPort: soap
  selector:
    {{- include "azerothcore.selectorLabels" (dict "ctx" . "component" "worldserver") | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-worldserver" (include "azerothcore.fullname" .) }}
  labels:
    {{- include "azerothcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: worldserver
spec:
  replicas: 1
  progressDeadlineSeconds: {{ .Values.worldserver.progressDeadlineSeconds }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "azerothcore.selectorLabels" (dict "ctx" . "component" "worldserver") | nindent 6 }}
  template:
    metadata:
      {{- include "azerothcore.podMetadata" (dict "ctx" . "component" "worldserver") | nindent 6 }}
    spec:
      {{- include "azerothcore.pullSecrets" . | nindent 6 }}
      {{- if include "azerothcore.waitsForJobs" . }}
      serviceAccountName: {{ include "azerothcore.serviceAccountName" . }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      initContainers:
        # Module SQL data (for example the mod-playerbots base SQL for
        # acore_playerbots) ships only in the db-import image. The worldserver
        # image has an empty /azerothcore/modules. Copy the data so that the
        # worldserver can create and populate module-owned databases at boot.
        # The copy is harmless for the vanilla flavor.
        - name: module-data
          image: {{ include "azerothcore.image" (dict "ctx" . "component" "dbImport") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["sh", "-c", "cd /azerothcore/modules && tar --exclude-vcs -cf - * | tar -xf - -C /module-data"]
          volumeMounts:
            - name: module-data
              mountPath: /module-data
        {{- if .Values.dbInit.enabled }}
        {{- include "azerothcore.waitJob" (dict "ctx" . "name" "db-init" "job" (include "azerothcore.dbInitJobName" .)) | nindent 8 }}
        {{- end }}
        {{- if eq .Values.clientData.source "download" }}
        {{- include "azerothcore.waitJob" (dict "ctx" . "name" "client-data" "job" (include "azerothcore.clientDataJobName" .)) | nindent 8 }}
        {{- end }}
      containers:
        - name: worldserver
          image: {{ include "azerothcore.image" (dict "ctx" . "component" "worldserver") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Interactive AzerothCore console: `kubectl attach -it <pod> -c worldserver`
          stdin: true
          tty: true
          env:
            - name: AC_DATA_DIR
              value: /azerothcore/env/dist/data
            - name: AC_LOGS_DIR
              value: /azerothcore/env/dist/logs
            {{- include "azerothcore.db.env" (dict "ctx" . "world" true) | nindent 12 }}
            - name: AC_REALM_ID
              value: {{ .Values.dbInit.realm.id | int | quote }}
            {{- if .Values.worldserver.soap.enabled }}
            - name: AC_SOAP_ENABLED
              value: "1"
            {{- end }}
            {{- include "azerothcore.configEnv" .Values.worldserver.config | nindent 12 }}
            {{- with .Values.worldserver.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: world
              containerPort: 8085
            {{- if .Values.worldserver.soap.enabled }}
            - name: soap
              containerPort: 7878
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /azerothcore/env/dist/data
              readOnly: true
            - name: module-data
              mountPath: /azerothcore/modules
              readOnly: true
            {{- if .Values.worldserver.elunaScripts.existingClaim }}
            - name: eluna-scripts
              mountPath: /azerothcore/env/dist/lua_scripts
              readOnly: true
            {{- end }}
          startupProbe:
            tcpSocket:
              port: world
            periodSeconds: {{ .Values.worldserver.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.worldserver.startupProbe.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: world
            periodSeconds: 30
          resources:
            {{- toYaml .Values.worldserver.resources | nindent 12 }}
      volumes:
        - name: data
          {{- include "azerothcore.dataVolume" . | nindent 10 }}
        - name: module-data
          emptyDir: {}
        {{- if .Values.worldserver.elunaScripts.existingClaim }}
        - name: eluna-scripts
          persistentVolumeClaim:
            claimName: {{ .Values.worldserver.elunaScripts.existingClaim }}
        {{- end }}
