{{- $fullname := include "azerothcore.fullname" . -}}
{{- $soap := .Values.worldserver.soap -}}
{{- $ra := .Values.worldserver.remoteAccess -}}
{{/* A non-root process cannot raise its priority, and the core logs an error when ProcessPriority asks it to. */}}
{{- $defaults := dict
  "DataDir" "/azerothcore/env/dist/data"
  "LogsDir" "/azerothcore/env/dist/logs"
  "RealmID" (.Values.dbInit.realm.id | int)
  "WorldServerPort" 8085
  "BindIP" "0.0.0.0"
  "SOAP.Enabled" (ternary 1 0 $soap.enabled)
  "SOAP.IP" "0.0.0.0"
  "SOAP.Port" ($soap.port | int)
  "Ra.Enable" (ternary 1 0 $ra.enabled)
  "Ra.IP" "0.0.0.0"
  "Ra.Port" ($ra.port | int)
  "ProcessPriority" 0
-}}
{{- with .Values.worldserver.luaScripts -}}
{{- $_ := set $defaults "ALE.ScriptPath" "/azerothcore/lua_scripts" -}}
{{- end -}}
{{- $bots := ternary .Values.playerbots.config dict (eq .Values.flavor "playerbots") -}}
{{- $config := merge (deepCopy .Values.worldserver.config) (deepCopy $bots) $defaults -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-worldserver" $fullname }}
  labels:
    {{- include "azerothcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: worldserver
  {{- with .Values.worldserver.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.worldserver.service.type }}
  {{- if and (ne .Values.worldserver.service.type "ClusterIP") .Values.worldserver.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.worldserver.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - name: world
      port: {{ .Values.worldserver.service.port }}
      targetPort: world
      {{- if and (ne .Values.worldserver.service.type "ClusterIP") .Values.worldserver.service.nodePort }}
      nodePort: {{ .Values.worldserver.service.nodePort }}
      {{- end }}
  selector:
    {{- include "azerothcore.selectorLabels" (dict "ctx" . "component" "worldserver") | nindent 4 }}
{{- if or $soap.enabled $ra.enabled }}
---
# Both consoles give GM access, so they stay on a ClusterIP service.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-worldserver-admin" $fullname }}
  labels:
    {{- include "azerothcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: worldserver
spec:
  type: ClusterIP
  ports:
    {{- if $soap.enabled }}
    - name: soap
      port: {{ $soap.port }}
      targetPort: soap
    {{- end }}
    {{- if $ra.enabled }}
    - name: ra
      port: {{ $ra.port }}
      targetPort: ra
    {{- end }}
  selector:
    {{- include "azerothcore.selectorLabels" (dict "ctx" . "component" "worldserver") | nindent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-worldserver" $fullname }}
  labels:
    {{- include "azerothcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: worldserver
spec:
  replicas: 1
  progressDeadlineSeconds: {{ .Values.worldserver.progressDeadlineSeconds }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "azerothcore.selectorLabels" (dict "ctx" . "component" "worldserver") | nindent 6 }}
  template:
    metadata:
      {{- include "azerothcore.podMetadata" (dict "ctx" . "component" "worldserver") | nindent 6 }}
    spec:
      {{- include "azerothcore.pullSecrets" . | nindent 6 }}
      {{- if include "azerothcore.waitsForJobs" . }}
      serviceAccountName: {{ include "azerothcore.serviceAccountName" . }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.worldserver.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # mod-playerbots fills its database at boot from the SQL in modules/.
        # The worldserver image has an empty modules/, and the db-import image
        # has the full one.
        - name: module-data
          image: {{ include "azerothcore.image" (dict "ctx" . "component" "dbImport") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["sh", "-c", "cd /azerothcore/modules && tar --exclude-vcs -cf - * | tar -xf - -C /module-data"]
          volumeMounts:
            - name: module-data
              mountPath: /module-data
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
        {{- if .Values.dbInit.enabled }}
        {{- include "azerothcore.waitJob" (dict "ctx" . "name" "db-init" "job" (include "azerothcore.dbInitJobName" .)) | nindent 8 }}
        {{- end }}
        {{- if eq .Values.clientData.source "download" }}
        {{- include "azerothcore.waitJob" (dict "ctx" . "name" "client-data" "job" (include "azerothcore.clientDataJobName" .)) | nindent 8 }}
        {{- end }}
      containers:
        - name: worldserver
          image: {{ include "azerothcore.image" (dict "ctx" . "component" "worldserver") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # The entrypoint of the image runs these. The core reads only
          # modules/<name>.conf, and the image ships <name>.conf.dist.
          args:
            - bash
            - -c
            - >-
              for f in /azerothcore/env/dist/etc/modules/*.conf.dist;
              do [ -e "$f" ] && cp "$f" "${f%.dist}"; done;
              exec worldserver
          # The worldserver console reads stdin: kubectl attach -it deploy/{{ $fullname }}-worldserver
          stdin: true
          tty: true
          env:
            {{- include "azerothcore.db.env" (dict "ctx" . "world" true) | nindent 12 }}
            {{- include "azerothcore.confEnv" $config | trim | nindent 12 }}
            {{- with .Values.worldserver.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: world
              containerPort: 8085
            {{- if $soap.enabled }}
            - name: soap
              containerPort: {{ $soap.port }}
            {{- end }}
            {{- if $ra.enabled }}
            - name: ra
              containerPort: {{ $ra.port }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /azerothcore/env/dist/data
              readOnly: true
            - name: module-data
              mountPath: /azerothcore/modules
              readOnly: true
            {{- include "azerothcore.writableMounts" . | nindent 12 }}
            {{- if .Values.worldserver.luaScripts }}
            - name: lua-scripts
              mountPath: /azerothcore/lua_scripts
              readOnly: true
            {{- end }}
          startupProbe:
            tcpSocket:
              port: world
            periodSeconds: {{ .Values.worldserver.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.worldserver.startupProbe.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: world
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.worldserver.resources | nindent 12 }}
      volumes:
        - name: data
          {{- include "azerothcore.dataVolume" . | nindent 10 }}
        - name: module-data
          emptyDir: {}
        {{- include "azerothcore.writableVolumes" . | nindent 8 }}
        {{- with .Values.worldserver.luaScripts }}
        - name: lua-scripts
          {{- toYaml . | nindent 10 }}
        {{- end }}
